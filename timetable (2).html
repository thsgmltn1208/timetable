        const baseSchedule = [

            [["","","","M"],["미적분I","김선정T","2-3","Base"],["영어II","이지연T","2-1","Base"],["","","","C"],["문학","이수환T","공동교육과정실","Base"],["","","","B"],["공강","박성훈T","2-2","Base"]],
            [["","","","D"],["","","","E"],["문학","이수환T","공동교육과정실","Base"],["","","","B"],["","","","A"],["","","","M"],["","","","C"]],
            [["","","","E"],["문학","정윤지T","2-2","Base"],["","","","D"],["영어II","이지연T","2-1","Base"],["미적분I","김선정T","2-3","Base"],["창체","-","-","Base"],["창체","-","-","Base"]]
        ];

        const ourClassHighlights = { 0:[0,2,4,5], 1:[2,3,4], 2:[0,1,2,4], 3:[2,5], 4:[1,3,4] };


        const timeSchedule = [
            {period:1,start:"08:40",end:"09:30"},{period:2,start:"09:40",end:"10:30"},
            {period:3,start:"10:40",end:"11:30"},{period:4,start:"11:40",end:"12:30"},
            {period:5,start:"13:30",end:"14:20"},{period:6,start:"14:30",end:"15:20"},
            {period:7,start:"15:40",end:"16:30"}
        ];

        let currentStudent = null; // { id, name }
        let userChoices = {};
        let generatedTimetable = [];
        let clockInterval;
        const STORAGE_KEY = "nsdg22_student_id";

        // --- 급식 알리미 (NEIS 오픈 API, 조식/중식/석식 + 좌우 이동) ---
        const NEIS_API_KEY = "dbbc06ac4f824cd4a7cfa7233a6331f6";
        const NEIS_OFFICE_CODE = "N10"; // 충청남도교육청
        const NEIS_SCHOOL_CODE = "8140085"; // 논산대건고등학교
        const MEAL_NAMES = { '1': '조식', '2': '중식', '3': '석식' };
        const MEAL_ORDER = ['1', '2', '3'];

        let mealState = null;       // { date: Date, mealCode: '1'|'2'|'3' } 현재 화면에 보이는 급식
        let mealManual = false;     // 화살표로 직접 넘긴 상태인지 여부 (true면 자동 전환 멈춤)
        let mealCache = new Map();  // "YYYYMMDD-mealCode" -> { status: 'loading'|'done', data }

        const fmtYYYYMMDD = (d) => {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}${m}${day}`;
        };
        const mealKey = (date, mealCode) => `${fmtYYYYMMDD(date)}-${mealCode}`;

        // 오전 8시→중식, 오후 1시30분→석식, 오후 8시→다음날 조식 순으로 자동 전환
        const computeAutoMealState = (now) => {
            const minutesNow = now.getHours() * 60 + now.getMinutes();
            const date = new Date(now);
            date.setHours(0, 0, 0, 0);
            let mealCode;
            if (minutesNow >= 20 * 60) {                 // 20:00 이후 → 다음날 조식
                date.setDate(date.getDate() + 1);
                mealCode = '1';
            } else if (minutesNow < 8 * 60) {             // 00:00~08:00 → (오늘) 조식
                mealCode = '1';
            } else if (minutesNow < 13 * 60 + 30) {       // 08:00~13:30 → 중식
                mealCode = '2';
            } else {                                      // 13:30~20:00 → 석식
                mealCode = '3';
            }
            return { date, mealCode };
        };

        const shiftMealState = (state, direction) => {
            let idx = MEAL_ORDER.indexOf(state.mealCode) + direction;
            const date = new Date(state.date);
            if (idx > 2) { idx = 0; date.setDate(date.getDate() + 1); }
            if (idx < 0) { idx = 2; date.setDate(date.getDate() - 1); }
            return { date, mealCode: MEAL_ORDER[idx] };
        };

        const fetchMealFromNeis = async (dateStr, mealCode) => {
            const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=${NEIS_API_KEY}&Type=json&ATPT_OFCDC_SC_CODE=${NEIS_OFFICE_CODE}&SD_SCHUL_CODE=${NEIS_SCHOOL_CODE}&MLSV_YMD=${dateStr}&MMEAL_SC_CODE=${mealCode}`;
            try {
                const res = await fetch(url);
                const json = await res.json();
                if (!json.mealServiceDietInfo) return null; // 해당 날짜·급식에 정보 없음
                const row = json.mealServiceDietInfo[1].row[0];
                const menu = (row.DDISH_NM || "")
                    .replace(/\([0-9.\s]+\)/g, '')
                    .split('<br/>')
                    .map(s => s.trim())
                    .filter(Boolean);
                return { menu, calorie: row.CAL_INFO || "" };
            } catch (e) {
                console.error("급식 정보 불러오기 실패:", e);
                return null;
            }
        };

        const renderMealWidget = () => {
            const titleEl = document.getElementById('meal-title');
            const contentEl = document.getElementById('meal-content');
            const calEl = document.getElementById('meal-calorie');
            if (!mealState || !titleEl || !contentEl || !calEl) return;

            titleEl.textContent = `${mealState.date.getMonth() + 1}월 ${mealState.date.getDate()}일 ${MEAL_NAMES[mealState.mealCode]}`;

            const entry = mealCache.get(mealKey(mealState.date, mealState.mealCode));
            if (!entry || entry.status === 'loading') {
                contentEl.textContent = "불러오는 중...";
                calEl.textContent = "";
                return;
            }
            if (entry.data === null) {
                contentEl.textContent = "급식 정보가 없어요 (주말·공휴일이거나 아직 업로드 전이에요).";
                calEl.textContent = "";
                return;
            }
            contentEl.innerHTML = entry.data.menu.map(item => `<div>• ${item}</div>`).join('');
            calEl.textContent = entry.data.calorie;
        };

        const loadMealForState = async (state) => {
            const key = mealKey(state.date, state.mealCode);
            if (!mealCache.has(key)) mealCache.set(key, { status: 'loading', data: null });
            renderMealWidget();
            if (mealCache.get(key).status === 'done') return; // 이미 불러온 데이터는 재요청 안 함

            const result = await fetchMealFromNeis(fmtYYYYMMDD(state.date), state.mealCode);
            mealCache.set(key, { status: 'done', data: result });
            if (mealState && mealKey(mealState.date, mealState.mealCode) === key) renderMealWidget();
        };

        // 화살표 버튼: 이전/다음 급식으로 수동 이동
        const goToMeal = (direction) => {
            if (!mealState) return;
            mealManual = true;
            mealState = shiftMealState(mealState, direction);
            loadMealForState(mealState);
        };

        // 매초 시계 갱신 시 호출: 자동 모드일 때만 시간대에 맞춰 급식을 전환
        const tickMealAuto = (now) => {
            if (!mealState) {
                mealState = computeAutoMealState(now);
                loadMealForState(mealState);
                return;
            }
            if (mealManual) return; // 사용자가 직접 넘긴 상태면 자동 전환 멈춤
            const auto = computeAutoMealState(now);
            if (mealKey(auto.date, auto.mealCode) !== mealKey(mealState.date, mealState.mealCode)) {
                mealState = auto;
                loadMealForState(mealState);
            }
        };

        const showView = (viewId) => {
            ['login-view','setup-view','dashboard-view'].forEach(id => {
                document.getElementById(id).classList.add('hide');
            });
            document.getElementById(viewId).classList.remove('hide');
        };
        const showLoading = (show) => {
            document.getElementById('loading').classList.toggle('hide', !show);
        };

        // --- Login (학번 + 이름 직접 입력) ---
        const showLoginError = (msg) => {
            const err = document.getElementById('login-error');
            err.textContent = msg;
            err.classList.remove('hide');
            [document.getElementById('input-student-id'), document.getElementById('input-student-name')].forEach(el => {
                el.classList.add('error');
                el.parentElement.parentElement.classList.add('shake');
                setTimeout(() => el.parentElement.parentElement.classList.remove('shake'), 350);
            });
        };
        const clearLoginError = () => {
            document.getElementById('login-error').classList.add('hide');
            document.getElementById('input-student-id').classList.remove('error');
            document.getElementById('input-student-name').classList.remove('error');
        };

        const startAsStudent = async (studentId) => {
            const s = roster.find(r => r.id === studentId);
            if (!s) return;
            showLoading(true);
            try {
                if (!auth.currentUser) await signInAnonymously(auth);
                currentStudent = { id: s.id, name: s.name };
                localStorage.setItem(STORAGE_KEY, s.id);
                document.getElementById('user-name-display').textContent = `${s.name} · ${s.id}`;

                const ref = doc(db, 'students', s.id);

                if (snap.exists() && snap.data().choices) {
                    userChoices = snap.data().choices;

        // --- Setup form ---
        const buildSetupForm = () => {
            const container = document.getElementById('select-containers');
            container.innerHTML = '';

            const icons = { A: 'fa-book', B: 'fa-flask', C: 'fa-microscope', D: 'fa-laptop-code', E: 'fa-globe', M: 'fa-music' };
            const chip = { A: 'bg-forest-100 text-forest-600', B: 'bg-amber-100 text-amber-600', C: 'bg-forest-100 text-forest-700', D: 'bg-amber-100 text-amber-700', E: 'bg-forest-100 text-forest-500', M: 'bg-amber-100 text-amber-500' };

            Object.keys(electivesData).forEach(key => {

        const loadSetupDataToForm = () => {
            Object.keys(electivesData).forEach(key => {

        const getFormData = () => {

            Object.keys(electivesData).forEach(key => {

        const generatePersonalTimetable = () => {
            let schedule = JSON.parse(JSON.stringify(baseSchedule));
            for (let d = 0; d < 5; d++) {
                for (let p = 0; p < 7; p++) {
                    const cellInfo = schedule[d][p];
                    const type = cellInfo[3];
                    if (electivesData[type]) {
                        const choiceIdx = userChoices[type];
                        const data = electivesData[type];
                        schedule[d][p] = [data.names[choiceIdx], data.teachers[choiceIdx], data.rooms[choiceIdx], type];
                    }

            }
            const getChoiceName = (key) => electivesData[key].names[userChoices[key]];
            const applyOverride = (day, period, tName, roomName) => {
                schedule[day][period] = ["독서", tName, roomName, "Override"];
            };
            const aName = getChoiceName('A'), bName = getChoiceName('B'), cName = getChoiceName('C');
            const dName = getChoiceName('D'), eName = getChoiceName('E');
            if (aName === "철학") applyOverride(0, 1, "김동해 신부님", "J301");
     	    if (aName === "심리") applyOverride(1, 0, "박성훈T", "AI 창의융합정보실");
            if (cName === "논술") applyOverride(2, 3, "권민영T", "2-4");
            if (cName === "심리") applyOverride(2, 3, "황인해T", "국어교과실");
            if (bName === "논술") applyOverride(2, 5, "권민영T", "2-4");
            if (cName === "철학") applyOverride(3, 6, "양정은T", "도서관");
            if (cName === "교육의 이해") applyOverride(1, 5, "박성훈T", "AI 창의융합정보실");
            if (dName === "논술") applyOverride(1, 6, "김동해 신부님", "J301");
            if (dName === "심리") applyOverride(4, 2, "김동해 신부님", "J301");
            generatedTimetable = schedule;
        };

        const renderTimetable = () => {
            const tbody = document.getElementById('timetable-body');
            tbody.innerHTML = '';

            const now = new Date();
            const todayDayIdx = now.getDay() - 1;
            const currentMins = now.getHours() * 60 + now.getMinutes();

            for (let p = 0; p < 7; p++) {
                const timeStr = `${timeSchedule[p].start}~${timeSchedule[p].end}`;
                tbody.insertAdjacentHTML('beforeend', `
                    <div class="flex flex-col items-center justify-center bg-paper rounded-xl p-1 font-bold text-ink-faint text-xs border border-forest-100 min-h-0">
                        <div class="text-forest-600 text-[11px] font-mono">${p + 1}</div>
                        <div class="text-[8px] leading-tight text-center font-medium text-ink-faint mt-0.5 font-mono">${timeStr}</div>
                    </div>
                `);

                for (let d = 0; d < 5; d++) {
                    const cellData = generatedTimetable[d][p];
                    const isHighlighted = ourClassHighlights[d] && ourClassHighlights[d].includes(p);

                    let isCurrent = false;
                    if (d === todayDayIdx && todayDayIdx >= 0 && todayDayIdx <= 4) {
                        const sMins = timeToMinutes(timeSchedule[p].start);
                        const eMins = timeToMinutes(timeSchedule[p].end);
                        if (currentMins >= sMins && currentMins < eMins) isCurrent = true;
                    }

                    let bgClass, textClass, borderExtra = '';
                    if (isCurrent) {
                        bgClass = 'bg-amber-50 border-amber-300';
                        textClass = 'text-amber-900';
                        borderExtra = 'pulse-current ring-1 ring-amber-200';
                    } else if (isHighlighted) {
                        bgClass = 'bg-forest-50 border-forest-200';
                        textClass = 'text-forest-900';
                    } else {
                        bgClass = 'bg-white border-forest-50';
                        textClass = 'text-ink';
                    }

                    let innerHtml = '';
                    if (cellData[0]) {
                        const currentDot = isCurrent ? `<div class="absolute top-1 right-1 w-1.5 h-1.5 bg-amber-500 rounded-full"></div>` : '';
                        innerHtml = `
                            ${currentDot}
                            <div class="font-bold text-[11px] ${textClass} truncate w-full text-center mb-0.5" title="${cellData[0]}">${cellData[0]}</div>
                            <div class="flex justify-between items-center w-full px-0.5 mt-auto gap-1">
                                <div class="text-[8px] text-ink-faint truncate font-medium">${cellData[1].replace('T','').replace(' 신부님','').replace(' 수녀님','')}</div>
                                <div class="text-[8px] text-ink-faint truncate max-w-[55%]">${cellData[2]}</div>
                            </div>
                        `;
                    } else {
                        innerHtml = `<div class="text-forest-100 text-xs">—</div>`;
                    }

                    tbody.insertAdjacentHTML('beforeend', `
                        <div class="timetable-cell relative flex flex-col items-center justify-center rounded-xl border p-1.5 h-full min-h-[40px] ${bgClass} ${borderExtra}">
                            ${innerHtml}
                        </div>
                    `);
                }
            }
        };

        const updateClock = () => {
            const now = new Date();
            const days = ['일','월','화','수','목','금','토'];
            const dateStr = `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 ${days[now.getDay()]}요일`;
            document.getElementById('current-date').textContent = dateStr;
            const hh = String(now.getHours()).padStart(2,'0');
            const mm = String(now.getMinutes()).padStart(2,'0');
            const ss = String(now.getSeconds()).padStart(2,'0');
            document.getElementById('current-time').textContent = `${hh}:${mm}:${ss}`;
            updateNextClassInfo(now);
            tickMealAuto(now);
        };

        const timeToMinutes = (timeStr) => {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        };

        const updateNextClassInfo = (now) => {
            const dayIdx = now.getDay() - 1;
            const currentMins = now.getHours() * 60 + now.getMinutes();
            const infoContainer = document.getElementById('next-class-info');

            if (dayIdx < 0 || dayIdx > 4 || (dayIdx === 4 && currentMins >= timeToMinutes(timeSchedule[6].end))) {
                infoContainer.innerHTML = `<div class="text-sm font-bold mt-1 opacity-80">정규 수업이 없습니다</div>`;
                return;
            }

            let nextPeriodIdx = -1;
            let statusText = "다음 수업";
            for (let i = 0; i < timeSchedule.length; i++) {
                const sMins = timeToMinutes(timeSchedule[i].start);
                const eMins = timeToMinutes(timeSchedule[i].end);
                if (currentMins < sMins) { nextPeriodIdx = i; break; }
                else if (currentMins >= sMins && currentMins < eMins) {
                    if (i < 6) { nextPeriodIdx = i + 1; statusText = "다음 수업"; }
                    else { statusText = "마지막 수업 진행중"; nextPeriodIdx = -2; }
                    break;
                }
            }

            if (currentMins >= timeToMinutes(timeSchedule[6].end)) {
                infoContainer.innerHTML = `<div class="text-sm font-bold mt-1 opacity-80">오늘 수업이 모두 끝났습니다</div>`;
                return;
            }
            if (nextPeriodIdx === -2) {
                infoContainer.innerHTML = `<div class="text-sm font-bold mt-1 opacity-80">마지막 교시 진행중</div>`;
                return;
            }
            if (nextPeriodIdx >= 0 && generatedTimetable.length > 0) {
                const cellData = generatedTimetable[dayIdx][nextPeriodIdx];
                if (cellData && cellData[0]) {
                    infoContainer.innerHTML = `
                        <div class="text-[10px] text-amber-300 mb-1 font-medium">${nextPeriodIdx+1}교시 · ${statusText}</div>
                        <div class="text-lg font-extrabold truncate tracking-tight">${cellData[0]}</div>
                        <div class="text-xs opacity-80 mt-1.5 flex items-center gap-2"><i class="fas fa-chalkboard-teacher text-[10px] w-3 text-forest-300"></i> <span>${cellData[1]}</span></div>
                        <div class="text-xs opacity-80 flex items-center gap-2"><i class="fas fa-map-marker-alt text-[10px] w-3 text-forest-300"></i> <span>${cellData[2]}</span></div>
                    `;
                } else {
                    infoContainer.innerHTML = `<div class="text-sm font-bold mt-1 opacity-80">다음 시간표 정보 없음</div>`;
                }
            }
        };

        let unsubscribeNotice = null;
        const setupNoticeBoard = () => {
            if (unsubscribeNotice) unsubscribeNotice();
            const noticeRef = doc(db, 'publicData', 'board');
            unsubscribeNotice = onSnapshot(noticeRef, (docSnap) => {
                const displayArea = document.getElementById('notice-display');
                if (docSnap.exists()) displayArea.textContent = docSnap.data().content || "등록된 공지사항이 없습니다.";
                else displayArea.textContent = "등록된 공지사항이 없습니다.";
            });
        };

        const initNoticeEditor = () => {
            document.getElementById('btn-edit-notice').addEventListener('click', () => {
                const pin = prompt("관리자 비밀번호를 입력하세요:");
                if (pin === "nsdg26") {
                    document.getElementById('notice-display').classList.add('hide');
                    document.getElementById('notice-edit-area').classList.remove('hide');
                    const current = document.getElementById('notice-display').textContent;
                    document.getElementById('notice-textarea').value = current === "등록된 공지사항이 없습니다." ? "" : current;
                } else if (pin !== null) {
                    alert("비밀번호가 틀렸습니다.");
                }
            });
            document.getElementById('btn-cancel-notice').addEventListener('click', () => {
                document.getElementById('notice-display').classList.remove('hide');
                document.getElementById('notice-edit-area').classList.add('hide');
            });
            document.getElementById('btn-save-notice').addEventListener('click', async () => {
                const content = document.getElementById('notice-textarea').value;
                const noticeRef = doc(db, 'publicData', 'board');
                try {
                    await setDoc(noticeRef, { content, updatedAt: new Date() });
                    document.getElementById('notice-display').classList.remove('hide');
                    document.getElementById('notice-edit-area').classList.add('hide');
                } catch (e) {
                    console.error("공지사항 저장 실패:", e);
                    alert("저장에 실패했습니다. 권한 설정을 확인하세요.");
                }
            });
        };

        const initApp = () => {
            initNoticeEditor();

            document.getElementById('meal-prev').addEventListener('click', () => goToMeal(-1));
            document.getElementById('meal-next').addEventListener('click', () => goToMeal(1));

            document.getElementById('login-form').addEventListener('submit', (e) => {
                e.preventDefault();
                clearLoginError();
                const idVal = document.getElementById('input-student-id').value.trim();
                const nameVal = document.getElementById('input-student-name').value.trim();
                const match = roster.find(r => r.id === idVal && r.name === nameVal);
                if (!match) {
                    showLoginError('학번과 이름이 명단과 일치하지 않아요. 다시 확인해주세요.');
                    return;
                }
                startAsStudent(match.id);
            });
            [document.getElementById('input-student-id'), document.getElementById('input-student-name')].forEach(el => {
                el.addEventListener('input', clearLoginError);
            });

            document.getElementById('setup-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const { choices, isValid } = getFormData();
                if (!isValid) { alert("모든 선택과목을 선택해주세요."); return; }
                if (!currentStudent) { alert("학생 정보를 찾을 수 없습니다. 처음부터 다시 시도해주세요."); return; }
                showLoading(true);
                userChoices = choices;
                try {
                    const ref = doc(db, 'students', currentStudent.id);
                    await setDoc(ref, { studentId: currentStudent.id, name: currentStudent.name, choices, updatedAt: new Date() }, { merge: true });
                    generatePersonalTimetable();
                    renderTimetable();
                    setupNoticeBoard();
                    updateClock();
                    showView('dashboard-view');
                    if (clockInterval) clearInterval(clockInterval);
                    clockInterval = setInterval(updateClock, 1000);
                } catch (error) {
                    console.error("데이터 저장 실패:", error);
                    alert("설정 저장에 실패했습니다.");
                } finally {
                    showLoading(false);
                }
            });

            document.getElementById('btn-re-setup').addEventListener('click', () => {
                if (!currentStudent) return;
                document.getElementById('btn-setup-cancel').classList.remove('hide');
                document.getElementById('setup-subtitle').textContent = `${currentStudent.name} (${currentStudent.id})`;
                buildSetupForm();
                loadSetupDataToForm();
                showView('setup-view');
            });
            document.getElementById('btn-setup-cancel').addEventListener('click', () => {
                showView('dashboard-view');
            });

            document.getElementById('btn-logout').addEventListener('click', () => {
                localStorage.removeItem(STORAGE_KEY);
                currentStudent = null;
                mealManual = false; // 다음 로그인 때는 다시 자동 모드로 시작
                if (clockInterval) clearInterval(clockInterval);
                if (unsubscribeNotice) unsubscribeNotice();
                document.getElementById('login-form').reset();
                clearLoginError();
                showView('login-view');
            });

            onAuthStateChanged(auth, async (user) => {
                if (!user) {
                    try { await signInAnonymously(auth); } catch (e) { console.error("익명 로그인 실패:", e); }
                    return;
                }
                if (currentStudent) return; // 이미 진행 중
                const savedId = localStorage.getItem(STORAGE_KEY);
                if (savedId && roster.some(r => r.id === savedId)) {
                    startAsStudent(savedId);
                } else {
                    showView('login-view');
                }
            });
        };

        initApp();
    </script>
</body>
</html>
